<style>
:root{
  --page:#F8F6F3; --card:#FFFFFF; --ink:#1C2733; --mut:#6B7A88; --line:#E6E1DA;
  --terra:#C74C33; --terra2:#D97A5F; --navy:#233343; --navy2:#3A5064;

}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);
  font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;

h1,h2,h3,h4{margin:0;font-weight:800;letter-spacing:-.01em}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 70px}
header{background:linear-gradient(150deg,#1A2733 0%,#233343 48%,#8F3A28 100%);color:#fff;padding:28px 0 24px}
header .wrap{padding-bottom:0}
.brandrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
header h1{font-size:29px}
header .sub{opacity:.86;font-size:13.5px;margin-top:7px;max-width:920px}
.pill{display:inline-block;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);
  padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
nav.tabs{position:sticky;top:0;z-index:40;background:rgba(248,246,243,.97);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);margin-bottom:24px}
nav.tabs .wrap{padding:0 20px;display:flex;gap:2px;overflow-x:auto;padding-bottom:0}
nav.tabs button{appearance:none;border:0;background:transparent;color:var(--mut);font:inherit;font-weight:700;
  font-size:13.5px;padding:13px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--terra)}
nav.tabs button.on{color:var(--terra);border-bottom-color:var(--terra)}
section.tab{display:none;animation:fade .18s ease}
section.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:19px 21px;box-shadow:var(--shadow);margin-bottom:17px}
.card h3{font-size:16.5px;margin-bottom:3px}
.card .cap{color:var(--mut);font-size:12.5px;margin-bottom:15px;max-width:900px}
.grid{display:grid;gap:17px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1020px){.g2,.g3,.g4,.g5{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:800}
.kpi .val{font-size:27px;font-weight:800;margin:5px 0 2px;letter-spacing:-.02em}
.kpi .note{font-size:12px;color:var(--mut)}
.kpi.good .val{color:var(--grn)} .kpi.bad .val{color:var(--red)} .kpi.terr .val{color:var(--terra)}
.kpi.navyv .val{color:var(--navy)}
.up{color:var(--grn);font-weight:800} .dn{color:var(--red);font-weight:800}
.call{border-left:4px solid var(--terra);background:#FDF4F1;border-radius:0 12px 12px 0;padding:13px 17px;margin:15px 0}
.call.grn{border-color:var(--grn);background:#F1F8F4} .call.blu{border-color:var(--blu);background:#F1F6FB}
.call.amb{border-color:var(--amber);background:#FDF8EC}
.call b{font-weight:800} .call p{margin:4px 0 0;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
  font-weight:800;padding:8px 9px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 9px;border-bottom:1px solid #F2EFEA}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:800;border-top:2px solid var(--line);background:#FAF8F5}
tr:hover td{background:#FAFAF8}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:800}
.chip.g{background:#E6F4EC;color:#1F6647} .chip.r{background:#FBE9E5;color:#8E3325}
.chip.b{background:#E9F0F8;color:#254F79} .chip.y{background:#FDF3DF;color:#8A6413}
.chip.m{background:#EFEAF6;color:#4C3A6B} .chip.n{background:#EEF0F2;color:#5A6773}
.chartbox{width:100%;overflow-x:auto}
svg{display:block;max-width:100%;height:auto}
.lgd{display:flex;gap:15px;flex-wrap:wrap;margin-top:9px;font-size:12px;color:var(--mut)}
.lgd i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hm td.c{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:12px}
footer{color:var(--mut);font-size:12px;text-align:center;padding:26px 0}
.qrow{display:grid;grid-template-columns:32px 1fr;gap:11px;padding:13px 0;border-bottom:1px solid #F2EFEA}
.qnum{width:29px;height:29px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:12.5px;
  display:flex;align-items:center;justify-content:center}
.qrow h4{font-size:14.5px;margin-bottom:4px}
.qrow p{margin:0;font-size:13px;color:var(--mut)}
.tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 7px;border-radius:5px;margin-right:6px}
.tag.auto{background:#E6F4EC;color:#1F6647} .tag.api{background:#E9F0F8;color:#254F79}
.tag.man{background:#FDF3DF;color:#8A6413}

const sum=a=>nz(a).reduce((x,y)=>x+y,0);
const avg=a=>{const n=nz(a);return n.length?sum(n)/n.length:null;};
const lastN=(a,n)=>{const o=[];for(let i=a.length-1;i>=0&&o.length<n;i--)if(a[i]!=null)o.unshift(a[i]);return o;};
/* YTD pair: sum both series only over weeks where the CURRENT year has a value,
   so a like-for-like comparison never counts prior-year weeks we haven't reached */
function ytd(cur,prior){let a=0,b=0,n=0;
  for(let i=0;i<cur.length;i++){if(cur[i]==null)continue;a+=cur[i];if(prior[i]!=null)b+=prior[i];n++;}
  return {cur:a,prior:b,n:n,yoy:b?(a-b)/b:null};}
function pct(a,b){return (b==null||b===0||a==null)?null:(a-b)/b;}
const idxLast=a=>{for(let i=a.length-1;i>=0;i--)if(a[i]!=null)return i;return -1;};

/* ================= tiny SVG chart engine (data labels on by default) ========= */
const CH={};
function svg(w,h){return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img">`;}
function txt(x,y,s,o={}){
  return `<text x="${x}" y="${y}" fill="${o.fill||"#6B7A88"}" font-size="${o.size||11}"
   font-weight="${o.w||600}" text-anchor="${o.anchor||"middle"}"
   font-family="Plus Jakarta Sans,Segoe UI,system-ui,sans-serif"${o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:""}>${s}</text>`;}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;
  return (n<=1?1:n<=1.5?1.5:n<=2?2:n<=2.5?2.5:n<=3?3:n<=4?4:n<=5?5:n<=7.5?7.5:10)*p;}

CH.bars=function(o){
  const Wd=o.width||880,H=o.height||300,PL=o.padL||58,PR=14,PT=o.padT||26,PB=o.padB||46;
  const L=o.labels,S=o.series,n=L.length,stk=!!o.stacked,fmt=o.fmt||fn;
  const gid=(sr,k)=>stk?"_all":(sr.stack||("_s"+k));
  const grpIds=[];S.forEach((sr,k)=>{const g=gid(sr,k);if(!grpIds.includes(g))grpIds.push(g);});
  const G=grpIds.length;let lo=0,hi=0;
  for(let i=0;i<n;i++){grpIds.forEach(g=>{let p=0,m=0;
    S.forEach((sr,k)=>{if(gid(sr,k)!==g)return;const v=sr.data[i]||0;if(v>=0)p+=v;else m+=v;});
    hi=Math.max(hi,p);lo=Math.min(lo,m);});}
  const top=niceMax(hi),bot=lo<0?-niceMax(-lo):0,span=(top-bot)||1;
  const iw=Wd-PL-PR,ih=H-PT-PB,Y=v=>PT+ih*((top-v)/span);
  let s=svg(Wd,H);const ticks=o.ticks||4;
  for(let t=0;t<=ticks;t++){const v=bot+(span*t/ticks),y=Y(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${Wd-PR}" y2="${y}" stroke="${Math.abs(v)<1e-9?"#B9C3C9":"#F0EDE8"}" stroke-width="1"/>`;
    s+=txt(PL-8,y+3.5,fmt(v),{anchor:"end",size:10});}
  const gw=iw/n,bw=Math.min(o.barW||(G===1?42:26),(gw*(G===1?.6:.78))/G);
  for(let i=0;i<n;i++){const cx=PL+gw*i+gw/2,sp=bw*G+2*(G-1);
    grpIds.forEach((g,gi)=>{const x=cx-sp/2+gi*(bw+2);let accP=0,accM=0,tot=0,any=false;
      S.forEach((sr,k)=>{if(gid(sr,k)!==g)return;const v=sr.data[i]||0;tot+=v;if(!v)return;any=true;
        let yA,yB;if(v>=0){yA=Y(accP+v);yB=Y(accP);accP+=v;}else{yA=Y(accM);yB=Y(accM+v);accM+=v;}
        s+=`<rect x="${x}" y="${yA}" width="${bw}" height="${Math.max(1,yB-yA)}" rx="2" fill="${sr.color}"/>`;});
      if(any&&o.dataLabels!==false){const yl=tot>=0?Y(accP)-5:Y(accM)+11;
        s+=txt(x+bw/2,yl,fmt(tot),{fill:"#1C2733",size:o.labSize||9.5,w:800});}});}
  for(let i=0;i<n;i++) if(o.xEvery?(i%o.xEvery===0||i===n-1):true)
    s+=txt(PL+gw*i+gw/2,H-PB+(o.rotX?14:16),esc(L[i]),{size:9.5,rot:o.rotX?-42:0,anchor:o.rotX?"end":"middle"});
  return s+"</svg>";};

CH.line=function(o){
  const Wd=o.width||880,H=o.height||300,PL=o.padL||58,PR=16,PT=26,PB=o.padB||46;
  const L=o.labels,S=o.series,n=L.length,fmt=o.fmt||fn;
  let lo=o.zero===false?Infinity:0,hi=0;
  S.forEach(s=>s.data.forEach(v=>{if(v==null)return;hi=Math.max(hi,v);lo=Math.min(lo,v);}));
  if(lo===Infinity)lo=0;
  const top=niceMax(hi),bot=lo<0?-niceMax(-lo):(o.zero===false?Math.max(0,Math.floor(lo*0.9)):0);
  const span=(top-bot)||1,iw=Wd-PL-PR,ih=H-PT-PB;
  const X=i=>PL+(n===1?iw/2:iw*i/(n-1)),Y=v=>PT+ih*((top-v)/span);
  let s=svg(Wd,H);
  for(let t=0;t<=4;t++){const v=bot+span*t/4,y=Y(v);
    s+=`<line x1="${PL}" y1="${y}" x2="${Wd-PR}" y2="${y}" stroke="#F0EDE8"/>`;
    s+=txt(PL-8,y+3.5,fmt(v),{anchor:"end",size:10});}
  S.forEach(sr=>{
    const seg=[];let cur=[];
    sr.data.forEach((v,i)=>{if(v==null){if(cur.length)seg.push(cur);cur=[];}else cur.push([X(i),Y(v),i]);});
    if(cur.length)seg.push(cur);
    seg.forEach(pts=>{
      if(o.area&&sr.area!==false&&pts.length>1)
        s+=`<path d="M${pts.map(p=>p[0]+","+p[1]).join(" L")} L${pts[pts.length-1][0]},${Y(bot)} L${pts[0][0]},${Y(bot)} Z" fill="${sr.color}" opacity=".12"/>`;
      s+=`<path d="M${pts.map(p=>p[0]+","+p[1]).join(" L")}" fill="none" stroke="${sr.color}" stroke-width="${sr.w||2.5}" stroke-linejoin="round"${sr.dash?' stroke-dasharray="5 4"':''}/>`;
      pts.forEach(p=>{const show=o.dataLabels&&(o.labelEvery?(p[2]%o.labelEvery===0||p[2]===idxLast(sr.data)):true);
        s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${show?3.3:2}" fill="#fff" stroke="${sr.color}" stroke-width="2"/>`;
        if(show)s+=txt(p[0],p[1]-9,fmt(sr.data[p[2]]),{fill:"#1C2733",size:9.5,w:800});});});});
  for(let i=0;i<n;i++) if(o.xEvery?(i%o.xEvery===0||i===n-1):true)
    s+=txt(X(i),H-PB+(o.rotX?14:16),esc(L[i]),{size:9.5,rot:o.rotX?-42:0,anchor:o.rotX?"end":"middle"});
  return s+"</svg>";};

CH.hbars=function(o){
  const items=o.items,n=items.length,rowH=o.rowH||27,PL=o.padL||190,PR=o.padR||92;
  const Wd=o.width||880,H=n*rowH+20,fmt=o.fmt||f0;
  const mx=niceMax(Math.max(...items.map(i=>Math.abs(i.value||0))))||1,iw=Wd-PL-PR;
  let s=svg(Wd,H);
  items.forEach((it,i)=>{const y=9+i*rowH,bw=Math.max(1.5,iw*Math.abs(it.value||0)/mx);
    s+=`<rect x="${PL}" y="${y}" width="${bw}" height="${rowH-11}" rx="3" fill="${it.color||"#C74C33"}"/>`;
    s+=txt(PL-9,y+rowH/2-1,esc(it.label),{anchor:"end",size:11,fill:"#1C2733",w:700});
    s+=txt(PL+bw+7,y+rowH/2-1,fmt(it.value),{anchor:"start",size:11,fill:"#1C2733",w:800});
    if(it.sub)s+=txt(Wd-6,y+rowH/2-1,esc(it.sub),{anchor:"end",size:10,fill:"#6B7A88",w:600});});
  return s+"</svg>";};

CH.hgroup=function(o){
  const items=o.items,n=items.length,rowH=o.rowH||34,PL=o.padL||210,PR=o.padR||110;
  const Wd=o.width||880,H=n*rowH+24,fmt=o.fmt||f0;
  const mx=niceMax(Math.max(1,...items.map(i=>Math.max(Math.abs(i.a||0),Math.abs(i.b||0)))));
  const iw=Wd-PL-PR,bh=(rowH-14)/2;let s=svg(Wd,H);
  items.forEach((it,i)=>{const y=9+i*rowH;
    [[it.a,o.colorA||"#8FA2B4",0],[it.b,o.colorB||"#C74C33",bh+2]].forEach(([v,c,dy])=>{
      const bw=Math.max(1.5,iw*Math.abs(v||0)/mx);
      s+=`<rect x="${PL}" y="${y+dy}" width="${bw}" height="${bh}" rx="2" fill="${c}"/>`;
      s+=txt(PL+bw+6,y+dy+bh-1.5,fmt(v),{anchor:"start",size:9.5,fill:"#1C2733",w:800});});
    s+=txt(PL-9,y+rowH/2-2,esc(it.label),{anchor:"end",size:10.5,fill:"#1C2733",w:700});
    if(it.sub)s+=txt(PL-9,y+rowH/2+9,esc(it.sub),{anchor:"end",size:9,fill:"#98A4AC",w:600});
    const d=(it.b==null||it.a==null)?null:it.b-it.a;
    if(d!=null&&Math.abs(d)>0.5)s+=txt(Wd-6,y+rowH/2+1.5,(d>0?"+":"")+fmt(d),{anchor:"end",size:9.5,w:800,
      fill:d>0?"#2F7D5B":"#B4402F"});});
  return s+"</svg>";};

CH.donut=function(o){
  const Wd=o.width||420,H=o.height||280,cx=Wd*.33,cy=H/2,R=Math.min(H,Wd*.6)/2-14,r=R*.6;
  const tot=o.items.reduce((a,b)=>a+Math.abs(b.value||0),0)||1;
  let a0=-Math.PI/2,s=svg(Wd,H);
  o.items.forEach(it=>{const frac=Math.abs(it.value||0)/tot,a1=a0+frac*Math.PI*2;
    const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);
    const xi=cx+r*Math.cos(a1),yi=cy+r*Math.sin(a1),xj=cx+r*Math.cos(a0),yj=cy+r*Math.sin(a0);
    const la=frac>.5?1:0;
    if(frac>0)s+=`<path d="M${x0},${y0} A${R},${R} 0 ${la} 1 ${x1},${y1} L${xi},${yi} A${r},${r} 0 ${la} 0 ${xj},${yj} Z" fill="${it.color}"/>`;
    if(frac>.04){const am=(a0+a1)/2,lx=cx+(R+13)*Math.cos(am),ly=cy+(R+13)*Math.sin(am);
      s+=txt(lx,ly+3,(frac*100).toFixed(0)+"%",{size:10.5,fill:"#1C2733",w:800,
        anchor:Math.cos(am)<-0.25?"end":Math.cos(am)>0.25?"start":"middle"});}
    a0=a1;});
  if(o.center){s+=txt(cx,cy-3,o.center,{size:15,fill:"#1C2733",w:800});
    if(o.centerSub)s+=txt(cx,cy+14,o.centerSub,{size:10,fill:"#6B7A88",w:600});}
  let ly=22;const lx=Wd*.68;
  o.items.forEach(it=>{s+=`<rect x="${lx}" y="${ly-8}" width="10" height="10" rx="2.5" fill="${it.color}"/>`;
    s+=txt(lx+15,ly+1,esc(it.label).slice(0,24),{anchor:"start",size:10.5,fill:"#1C2733",w:700});
    s+=txt(lx+15,ly+13,(o.fmt||fk)(it.value),{anchor:"start",size:10,fill:"#6B7A88",w:600});ly+=27;});
  return s+"</svg>";};

CH.legend=(items)=>`<div class="lgd">`+items.map(i=>`<span><i style="background:${i.color}"></i>${esc(i.label)}</span>`).join("")+`</div>`;
function box(i){return `<div class="chartbox">${i}</div>`;}
function kpi(lab,val,note,cls){return `<div class="kpi ${cls||""}"><div class="lab">${lab}</div>
  <div class="val">${val}</div><div class="note">${note||""}</div></div>`;}
function yoyNote(a,b,unit){const p=pct(a,b);if(p==null)return "no prior-year figure";
  return `<span class="${p>=0?"up":"dn"}">${fpn(p)}</span> vs ${unit||""}${f0(b)} last year`;}
function card(title,cap,body){return `<div class="card"><h3>${title}</h3>${cap?`<div class="cap">${cap}</div>`:""}${body}</div>`;}

/* ---------- shared slices ---------- */
const N26 = LI+1;                                  /* weeks of 2026 on the sheet */
const LBL = W.slice(0,N26).map(md);
const LBL_ALL = W.map(md);
const C = {t:"#C74C33",t2:"#D97A5F",n:"#233343",n2:"#5C7286",g:"#2F7D5B",g2:"#63B08C",
           b:"#2C5F91",b2:"#6FA0CC",a:"#D89A2B",p:"#6B5192",te:"#2E7D86",gy:"#9AA7B2"};
const sl=a=>a.slice(0,N26);

/* annual averages out of a historical year-block */
function annualAvg(bl){
  return bl.years.map((y,k)=>({year:y,avg:avg(bl.rows.map(r=>r.v[k])),
                               n:nz(bl.rows.map(r=>r.v[k])).length}));
}

const T=[];
function tab(id,label,html){T.push({id,label,html});}

/* =========================== 1. THIS WEEK =========================== */
(function(){
  const i=LI, wk=W[i];
  /* A metric is only compared against the SAME week of last year, and only the
     components that actually have a 2026 figure are counted on either side.
     Without that, a ministry that has not filed its number yet reads as a
     collapse (InsideOut missing on 26 Jul made students look -69%). */
  function pairAt(idx,cur,pri,names){
    let a=0,b=0,used=[],miss=[];
    cur.forEach((arr,k)=>{ if(arr[idx]!=null){a+=arr[idx];b+=(pri[k][idx]||0);used.push(names[k]);}
                           else miss.push(names[k]); });
    return {v:used.length?a:null,p:used.length?b:null,miss:miss};
  }
  function yn(o,extra){
    if(o.v==null)return "not recorded this week";
    const p=pct(o.v,o.p);
    const base=p==null?"no prior-year figure":
      `<span class="${p>=0?"up":"dn"}">${fpn(p)}</span> vs ${f0(o.p)} last year`;
    return base+(o.miss&&o.miss.length?` &middot; ${o.miss.join(" and ")} not yet in`:"")+(extra||"");
  }
  const ip=DA.adult_ip_26[i], ipL=DA.adult_ip_25[i];
  const on=DA.online_26[i], onL=DA.online_25[i];
  const eng=DA.adult_eng_26[i], engL=DA.adult_eng_25[i];
  const tip=DA.tot_ip_26[i], tipL=DA.tot_ip_25[i];
  const gv=DA.giving[i], gu=DA.giving_units[i];
  const oKids=pairAt(i,[DA.wl_26,DA.us_26],[DA.wl_25,DA.us_25],["Waumba Land","UpStreet"]);
  const oStu =pairAt(i,[DA.tr_26,DA.io_26],[DA.tr_25,DA.io_25],["Transit","InsideOut"]);
  /* flag a giving week that is wildly off its own recent run rate */
  const g12=lastN(DA.giving.slice(0,i),12).sort((a,b)=>a-b);
  const gmed=g12.length?g12[Math.floor(g12.length/2)]:null;
  const gOut=(gv!=null&&gmed&&gv>gmed*2.5);

  const yIP=ytd(DA.adult_ip_26,DA.adult_ip_25), yON=ytd(DA.online_26,DA.online_25),
        yEN=ytd(DA.adult_eng_26,DA.adult_eng_25), yTI=ytd(DA.tot_ip_26,DA.tot_ip_25),
        yWL=ytd(DA.wl_26,DA.wl_25), yUS=ytd(DA.us_26,DA.us_25),
        yTR=ytd(DA.tr_26,DA.tr_25), yIO=ytd(DA.io_26,DA.io_25);
  const g26=D.giving.weekly["2026"], g25=D.giving.weekly["2025"];
  const yGV=ytd(g26,g25);

  let h = `<div class="grid g4" style="margin-bottom:17px">
    ${kpi("Adults in the room",f0(ip),yoyNote(ip,ipL),"navyv")}
    ${kpi("Online connections",f0(on),yoyNote(on,onL),"navyv")}
    ${kpi("Total adult engagement",f1(eng),yoyNote(eng,engL),"terr")}
    ${kpi("Everyone in the building",f0(tip),yoyNote(tip,tipL),"terr")}
  </div>
  <div class="grid g4" style="margin-bottom:17px">
    ${kpi("Kids (WL + UpStreet)",f0(oKids.v),yn(oKids))}
    ${kpi("Students (Transit + IO)",f0(oStu.v),yn(oStu))}
    ${kpi("Giving this week",fd(gv),(gu!=null?f0(gu)+" giving units":"")+
        (gOut?` &middot; <b>well above the recent run rate of ${fd(gmed)} &mdash; check for a single large gift</b>`:""))}
    ${kpi("Giving YTD",fk(yGV.cur),`<span class="${yGV.yoy>=0?"up":"dn"}">${fpn(yGV.yoy)}</span> vs ${fk(yGV.prior)} same weeks last year`,"good")}
  </div>`;

  const rows=[["Adults in-person",yIP],["Online connections",yON],["Total adult engagement",yEN],
              ["Waumba Land",yWL],["UpStreet",yUS],["Transit",yTR],["InsideOut",yIO],
              ["Everyone in the building",yTI]];
  h += card("Year to date, week for week",
    `Both columns cover the same ${yIP.n} weeks, so nothing is inflated by weeks 2026 has not reached yet.`,
    `<table><thead><tr><th>Measure</th><th class="n">2026 YTD</th><th class="n">2025 same weeks</th>
      <th class="n">Change</th><th class="n">2026 weekly avg</th></tr></thead><tbody>`+
    rows.map(([l,y])=>`<tr><td>${l}</td><td class="n">${f0(y.cur)}</td><td class="n">${f0(y.prior)}</td>
      <td class="n"><span class="chip ${y.yoy>=0?"g":"r"}">${fpn(y.yoy)}</span></td>
      <td class="n">${f1(y.cur/y.n)}</td></tr>`).join("")+
    `<tr class="tot"><td>General giving</td><td class="n">${fd(yGV.cur)}</td><td class="n">${fd(yGV.prior)}</td>
      <td class="n"><span class="chip ${yGV.yoy>=0?"g":"r"}">${fpn(yGV.yoy)}</span></td>
      <td class="n">${fd(yGV.cur/yGV.n)}</td></tr></tbody></table>`);

  h += card("Total adult engagement, week by week",
    "In-person plus online connections. The grey line is the same week in 2025.",
    box(CH.line({labels:LBL,width:1180,height:330,xEvery:2,rotX:true,dataLabels:true,labelEvery:3,zero:false,
      series:[{data:sl(DA.adult_eng_25),color:C.gy,dash:true},
              {data:sl(DA.adult_eng_26),color:C.t}]}))+
    CH.legend([{label:"2025",color:C.gy},{label:"2026",color:C.t}]));

  const note=D.notes[i], wx=D.weather[i];
  if(note||wx) h += card("Week note",`Week of ${md(wk)}`,
    `<p style="margin:0;font-size:13.5px">${wx?`<b>Weather:</b> ${esc(wx)}. `:""}${note?esc(note):""}</p>`);

  tab("now","This Week",h);
})();

/* =========================== 2. ATTENDANCE =========================== */
(function(){
  let h = card("Adults in the room, 2026 vs 2025","Sunday in-person adult attendance, both services combined.",
    box(CH.bars({labels:LBL,width:1180,height:320,xEvery:2,rotX:true,labSize:8.5,
      series:[{data:sl(DA.adult_ip_25),color:C.gy,stack:"a"},{data:sl(DA.adult_ip_26),color:C.n,stack:"b"}]}))+

    "Sunday online connections. Online has been the softer half of the year and is worth watching.",
    box(CH.bars({labels:LBL,width:1180,height:300,xEvery:2,rotX:true,labSize:8.5,
      series:[{data:sl(DA.online_25),color:C.gy,stack:"a"},{data:sl(DA.online_26),color:C.b,stack:"b"}]}))+

  h += card("How Sunday splits across the two services",

    box(CH.bars({labels:LBL,width:1180,height:320,xEvery:2,rotX:true,stacked:true,labSize:8.5,

  const cap=sl(D.spd.cap930).map((v,i)=>{const b=sl(D.spd.cap1100)[i];
    return (v==null&&b==null)?null:((v||0)+(b||0))/2;});
  h += card("Room capacity used","Average of the two services against the chair count. Over 100% means chairs were added or the room was full.",
    box(CH.line({labels:LBL,width:1180,height:280,xEvery:2,rotX:true,dataLabels:true,labelEvery:3,zero:false,
      fmt:v=>v==null?"":(v*100).toFixed(0)+"%",series:[{data:cap,color:C.a}]})));

  const aip=annualAvg(D.hist.adult_ip), aon=annualAvg(D.hist.adult_on), ato=annualAvg(D.hist.adult_tot);
  h += card("Sunday adults, every year since 2012",
    "Average weekly attendance per year. 2026 is a partial year and covers "+aip[aip.length-1].n+" weeks so far.",
    box(CH.bars({labels:aip.map(a=>String(a.year)),width:1180,height:320,fmt:f0,barW:34,
      series:[{data:aip.map(a=>a.avg),color:C.n,stack:"a"}]})));

  h += card("In-person, online and total, by year","Online only starts in 2018.",
    box(CH.line({labels:ato.map(a=>String(a.year)),width:1180,height:310,dataLabels:true,fmt:f0,
      series:[{data:ato.years,color:"#fff"}].slice(0,0).concat([
        {data:ato.map(a=>a.avg),color:C.t},
        {data:aip.map(a=>a.avg),color:C.n},
        {data:ato.map(a=>{const m=aon.find(x=>x.year===a.year);return m?m.avg:null;}),color:C.b}])}))+

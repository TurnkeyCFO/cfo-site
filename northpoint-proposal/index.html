<style>
:root{
  --page:#F8F6F3; --card:#FFFFFF; --ink:#1C2733; --mut:#657482; --line:#E7E2DB;
  --terra:#C74C33; --navy:#233343;
  --shadow:0 1px 2px rgba(28,39,51,.04),0 10px 30px rgba(28,39,51,.07);
}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--page);color:var(--ink);
 font-family:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
 font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2{margin:0;font-weight:800;letter-spacing:-.018em;line-height:1.2}
.wrap{max-width:1040px;margin:0 auto;padding:0 22px}
header{background:linear-gradient(155deg,#18232E 0%,#233343 46%,#8E3A28 100%);color:#fff;
 padding:44px 0 40px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;right:-140px;top:-150px;width:440px;height:440px;
 border-radius:50%;background:rgba(255,255,255,.045)}
header .eyebrow{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;
 opacity:.8;margin-bottom:12px}
header h1{font-size:34px;max-width:24ch;position:relative}
section{padding:44px 0}
h2{font-size:26px;margin-bottom:22px}
/* the dashboard, as one big clickable surface */
a.preview{display:block;text-decoration:none;color:inherit;background:var(--card);
 border:1px solid var(--line);border-radius:18px;padding:16px 16px 0;box-shadow:var(--shadow);
 overflow:hidden;position:relative;transition:transform .16s ease,box-shadow .16s ease}
a.preview:hover{transform:translateY(-3px);
 box-shadow:0 2px 4px rgba(28,39,51,.05),0 18px 44px rgba(28,39,51,.14)}
a.preview .shot{border-radius:12px;overflow:hidden;border:1px solid #EDE8E1;line-height:0;
 max-height:470px;position:relative}
/* the crop is a peek, not a mistake - fade it so it reads that way */
a.preview .shot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:88px;
 background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(255,255,255,.92))}
a.preview .shot img{width:100%;display:block}
a.preview .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;
 padding:16px 6px 18px;flex-wrap:wrap}
a.preview .bar .t{font-size:17px;font-weight:800}
a.preview .bar .s{font-size:13.5px;color:var(--mut)}
.opencta{background:var(--terra);color:#fff;font-weight:800;font-size:14.5px;padding:12px 24px;
 border-radius:11px;white-space:nowrap}
.badge2{position:absolute;top:0;right:0;background:var(--navy);color:#fff;font-size:10.5px;
 font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:7px 15px;
 border-radius:0 18px 0 12px;z-index:2}
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:26px;
 box-shadow:var(--shadow)}
.chartbox{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
svg{display:block;max-width:100%;height:auto}
.chartbox.wide svg{min-width:760px;max-width:none}
.scrollhint{display:none;font-size:11.5px;color:var(--mut);font-weight:700;margin-top:8px}
@media(max-width:780px){.scrollhint{display:block}}
footer{text-align:center;color:var(--mut);font-size:13px;padding:10px 0 46px}
footer a{color:var(--terra)}
</style>
